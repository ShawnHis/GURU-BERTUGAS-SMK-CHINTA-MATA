            // Automatic Duty Lookup logic: start_date <= activity_date <= end_date
            const findDutyTeachersByDate = (activityDate) => {
                if (!activityDate) return null;
                const match = dutySchedule.find(ds => {
                    return activityDate >= ds.start_date && activityDate <= ds.end_date;
                });

                if (!match) return null;

                // Find corresponding teacher records in directory for official emails
                const t1 = teachers.find(t => t.name.toUpperCase() === match.teacher_1_name.toUpperCase());
                const t2 = teachers.find(t => t.name.toUpperCase() === match.teacher_2_name.toUpperCase());

                return {
                    week_number: match.week_number,
                    code: match.code,
                    start_date: match.start_date,
                    end_date: match.end_date,
                    teacher_1: match.teacher_1_name,
                    teacher_2: match.teacher_2_name,
                    teacher_1_email: t1 ? t1.official_email : 'Tiada E-mel',
                    teacher_2_email: t2 ? t2.official_email : 'Tiada E-mel'
                };

            // Login Handler

                        name: found.name,
                        email: found.official_email,
                        role: found.role
                    });

                                        </button>

                case 'book-open': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>;

                case 'bell': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 01-6 0v-1m6 0H9"></path></svg>;
