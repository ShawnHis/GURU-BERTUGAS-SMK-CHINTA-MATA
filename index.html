        // Logic pengesan guru bertugas berasaskan tarikh: start_date <= activity_date <= end_date
        function getDutyTeachersForDate(activityDateStr) {
            if (!activityDateStr) return null;
            const actDate = new Date(activityDateStr);
            
            // Find match
            for (let schedule of state.dutySchedule) {
                if (schedule.start_date && schedule.end_date) {
                    const startDate = new Date(schedule.start_date);
                    const endDate = new Date(schedule.end_date);
                    // normalize dates to midnight
                    actDate.setHours(0,0,0,0);
                    startDate.setHours(0,0,0,0);
                    endDate.setHours(0,0,0,0);

                    if (actDate >= startDate && actDate <= endDate) {
                        // Find official emails from directory
                        const t1 = state.teachers.find(t => t.name.toUpperCase() === schedule.teacher_1.toUpperCase());
                        const t2 = state.teachers.find(t => t.name.toUpperCase() === schedule.teacher_2.toUpperCase());

                        return {
                            week_number: schedule.week_number,
                            code: schedule.code,
                            teacher_1: schedule.teacher_1,
                            teacher_2: schedule.teacher_2,
                            email_1: t1 ? t1.official_email : "Tiada E-mel",
                            email_2: t2 ? t2.official_email : "Tiada E-mel"
                        };
                    }
                }
            }
            return null; // Tiada padanan
        }

            const newAnn = {

                title: state.newForm.title,
                category: state.newForm.category,

                end_time: state.newForm.end_time,

                duty_emails: dutyInfo ? [dutyInfo.email_1, dutyInfo.email_2] : ["-"]

            showToast("Teks berjaya disalin ke papan keratan (clipboard)!");

        function renderDutyEditForm() {
            const form = state.dutyEditForm;
            return `
            <div class="bg-amber-50/80 border-2 border-amber-400 p-6 rounded-2xl space-y-4">
                <div class="flex justify-between items-center border-b border-amber-200 pb-3">

                    </div>

                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Guru Bertugas 2</label>

                            ${state.teachers.map(t => `<option value="${t.name}" ${form.teacher_2 === t.name ? 'selected' : ''}>${t.name}</option>`).join('')}
                        </select>
                    </div>
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button onclick="state.dutyEditForm = null; render();" class="px-4 py-2 bg-slate-200 text-slate-800 font-bold rounded-lg text-xs">BATAL</button>
                    <button onclick="saveDutyEdit()" class="px-5 py-2 bg-emerald-600 text-white font-extrabold rounded-lg text-xs shadow">SIMPAN PERUBAHAN</button>
                </div>
            </div>
            `;
        }

        function startEditDuty(id) {
            const item = state.dutySchedule.find(s => s.id === id);
            if (item) {
                state.dutyEditForm = { ...item };
                render();
            }
        }

        function saveDutyEdit() {
            const form = state.dutyEditForm;

            // VALIDASI
            if (form.teacher_1 === form.teacher_2) {
                showToast("Guru bertugas 1 dan Guru bertugas 2 tidak boleh merupakan guru yang sama.", "error");
                return;
            }

            if (form.start_date && form.end_date && new Date(form.start_date) > new Date(form.end_date)) {
                showToast("Tarikh mula tidak boleh lebih lewat daripada tarikh akhir.", "error");
                return;
            }

            const idx = state.dutySchedule.findIndex(s => s.id === form.id);
            if (idx !== -1) {
                state.dutySchedule[idx] = { ...form };
                addAuditLog("Mengemaskini Jadual Guru Bertugas", `Minggu ${form.week_number} (${form.code})`);
                state.dutyEditForm = null;
                showToast("Maklumat guru bertugas berjaya dikemas kini.");
                render();
            }
        }

        function handleDeleteDuty(id) {
            if (confirm("Adakah anda pasti mahu memadam jadual minggu ini?")) {
                state.dutySchedule = state.dutySchedule.filter(s => s.id !== id);
                addAuditLog("Memadam Jadual Guru Bertugas", `ID Schedule: ${id}`);
                showToast("Jadual berjaya dipadam.");
                render();
            }
        }

        function handleAddNewWeekPrompt() {
            const nextWeekNum = state.dutySchedule.length > 0 ? Math.max(...state.dutySchedule.map(s => s.week_number)) + 1 : 38;
            const newDuty = {
                id: Date.now(),
                week_number: nextWeekNum,
                code: "BAHARU",
                start_date: "2026-11-23",
                end_date: "2026-11-29",
                teacher_1: state.teachers[0].name,
                teacher_2: state.teachers[1].name
            };
            state.dutySchedule.push(newDuty);
            state.dutyEditForm = { ...newDuty };
            addAuditLog("Menambah Minggu Baharu", `Minggu ${nextWeekNum}`);
            showToast("Minggu baharu ditambah. Sila lengkapkan butiran.");
            render();
        }

                        </p>
                    </div>

        function render() {
            const app = document.getElementById("app");
            if (!app) return;

            if (state.currentTab === "login") {
                app.innerHTML = renderLogin();
                return;
            }

            let bodyContent = "";

            switch (state.currentTab) {
                case "dashboard":
                    bodyContent = renderDashboard();
                    break;
                case "add_announcement":
                    bodyContent = renderAddAnnouncementForm();
                    break;
                case "generator_tools":
                    bodyContent = renderGeneratorTools();
                    break;
                case "announcements_list":
                case "history":
                    bodyContent = renderAnnouncementsList();
                    break;
                case "duty_schedule_view":
                case "calendar":
                    bodyContent = renderDutyScheduleView();
                    break;
                case "admin_duty_management":
                    bodyContent = renderAdminDutyManagement();
                    break;
                case "admin_teachers":
                    bodyContent = renderAdminTeachers();
                    break;
                case "admin_audit":
                    bodyContent = renderAdminAudit();
                    break;
                case "reminders":
                case "admin_stats":
                case "admin_settings":
                    bodyContent = renderDashboard();
                    break;
                default:
                    bodyContent = renderDashboard();
            }

            app.innerHTML = `
                ${renderHeader()}
                ${renderNavigation()}
                <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                    ${bodyContent}

                <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs font-semibold text-slate-500 no-print">
                    SMK CHINTA MATA &copy; 2026 | SISTEM PENGUMUMAN GURU BERTUGAS | Super Admin: Shawn Christien Fabian
                </footer>

                ${state.toast ? `
                <div class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white font-extrabold text-xs px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-2 border border-slate-700">
                    <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
                    <span>${state.toast.message}</span>
                </div>
                ` : ''}
            `;
        }

        // Initialize App on Window Load
        window.onload = function() {
            render();
        };
    </script>
